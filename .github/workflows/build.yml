name: Compilar Salsa64 B3313 PS3

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ps3dev/ps3dev:latest
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Compilar EBOOT
        run: |
          make clean || true
          make

      - name: Guardar archivos compilados
        uses: actions/upload-artifact@v4
        with:
          name: Salsa64-B3313-EBOOT
          path: |
            *.self
            *.elf
            *.bin
            *.pkg
