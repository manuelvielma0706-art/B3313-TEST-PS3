name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ps3dev/ps3dev:latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git clone --recursive https://github.com src
          cd src && make
      - uses: actions/upload-artifact@v4
        with:
          name: EBOOT
          path: src/*.self
